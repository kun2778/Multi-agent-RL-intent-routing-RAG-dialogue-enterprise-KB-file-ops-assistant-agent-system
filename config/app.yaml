# Application Configuration for AgentRL System
# Contains RL training, RAG, and system parameters

app:
  name: "AgentRL_IntentRouting"
  version: "2.0.0"
  debug: false
  log_level: "INFO"

# RL 运行参数（由 rl_config.py 读取，AgentRL/AgentState/TerminationPolicy 生效）：
#   gamma → AgentRL.gamma；max_rounds → AgentState.max_rounds / TerminationPolicy.max_rounds；
#   retrieval_budget(秒) → AgentState.retrieval_budget / TerminationPolicy.time_threshold
rl:
  max_rounds: 5
  retrieval_budget: 300.0  # seconds
  training_episodes: 20
  epsilon_start: 1.0
  epsilon_decay: 0.995
  epsilon_min: 0.05
  gamma: 0.95  # discount factor
  learning_rate: 0.001
  replay_buffer_size: 10000
  batch_size: 32
  target_update_tau: 0.005

# LLM 意图路由：DeepSeek 为主端点，本地 Ollama 为备端点
intent_llm:
  provider: "deepseek"
  model: "deepseek-chat"
  timeout: 15
  # 容灾降级：主端点密钥缺失/失效或调用失败时，自动切换到本地 Ollama
  fallback:
    provider: "local"
    model: "qwen2.5:3b-instruct"
    base_url: "http://127.0.0.1:11434/v1"
    timeout: 60
  # 奖励表：在 AgentRL.__init__ 中合并进 agent_rl.AgentRL.REWARD_MAP（键名先经
  # rl_config.REWARD_KEY_ALIASES 归一到代码规范键，如 query_success / add_failure），
  # 修改此处即改变运行时奖励；键名必须与 REWARD_MAP 一致
  reward:
    add_success: 5.0
    delete_success: 5.0
    modify_success: 5.0
    refactor_success: 7.0
    query_success: 5.0
    deep_search_success: 8.0
    add_failure: -4.0
    delete_failure: -4.0
    modify_failure: -4.0
    refactor_failure: -4.0
    insufficient_evidence: -2.0
    clarification_resolved: 7.0
    timeout: -3.0
    evidence_sufficient: 8.0
    # 输入不完整（缺文件名/缺内容）≠ 执行失败，中性 0（见 agent_rl.REWARD_MAP）
    missing_slot: 0.0
    # 轮次衰减（运行时真源：agent_rl.py 顶部 CLARIFY_* / R_WRONG 常量）：
    #   带 state 调用时，答对键按 a_k = a_{k-1} - q_k - eps_k 折算，
    #   clarification_resolved 按 q_k = 1.5 * 0.8^(k-1) 折算（k = 已澄清轮数+1），
    #   失败/超时键不衰减。路径总量满足 P1 < P2 = P3 > P4 > ... > 答错(-4.0)。
    #   询问/回答决策由 agent_rl.confidence_threshold(k) 的期望阈值 p* 决定。

rag:
  chunk_size: 500
  chunk_overlap: 75       # 15% of chunk_size
  top_k: 5
  embedding_dim: 128
  similarity_threshold: 0.7
  use_faiss: true
  faiss_index_path: ".runtime/faiss"
  max_chunks: 50000

vector_search:
  provider: "faiss"  # faiss, numpy
  dimension: 128
  metric: "inner_product"  # inner_product, cosine
  normalize: true

# FAISS 向量存储配置
faiss_store:
  dimension: 128
  chunk_size: 500
  chunk_overlap: 75
  index_type: "flat"       # flat (IndexFlatIP) 或 ivf (IndexIVFFlat)
  persist_dir: ".runtime/faiss"

# 检索式意图识别：标注语料库向量召回，作为 classify_intent 第四路投票信号
# （与端到端分类头/Q网络/LLM/规则 并列，低相似度自动弃权，不替代任何一路）
intent_retrieval:
  enabled: true
  top_k: 5               # 召回相似例句数
  min_similarity: 0.30   # 低于该相似度弃权（避免 OOD 乱投）
  max_samples: 320000    # 语料上限（现有 30 万 + 在线增量余量；超量按标签均匀抽样）
  persist: true          # 向量索引持久化到 .runtime/cache/intent_index/

# Embedding configuration
embedding:
  backend: "auto"  # auto | sentence_transformers | tfidf
  model: "BAAI/bge-small-zh-v1.5"  # sentence-transformers model name
  dimension: null  # null = auto-detect from model (512 for bge-small-zh, 128 for tfidf)
  batch_size: 32

# LLM generation configuration
generation:
  default_temperature: 0.7
  default_max_tokens: 2048
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0
  stop_sequences: []

# OpenAI integration
openai:
  admin_api_key_env: "OPENAI_ADMIN_KEY"
  organization_id_env: "OPENAI_ORG_ID"
  default_model: "gpt-4o"
  dynamic_key_ttl: 3600  # seconds
  key_rotation_period: 7200  # seconds

# Vault configuration
vault:
  enabled: false
  url_env: "VAULT_ADDR"
  token_env: "VAULT_TOKEN"
  namespace_env: "VAULT_NAMESPACE"
  openai_engine: "openai"
  role_name: "agent-rl-app"
  role_ttl: "1h"
  role_max_ttl: "24h"
  rotation_period: "720h"

# OCR Configuration
ocr:
  enabled: false
  # 主要OCR提供商
  provider: "baidu"  # baidu, tencent, alibaba, tesseract
  # 百度OCR配置
  baidu:
    api_key_env: "BAIDU_OCR_API_KEY"
    secret_key_env: "BAIDU_OCR_SECRET_KEY"
    access_token_url: "https://aip.baidubce.com/oauth/2.0/token"
    ocr_url: "https://aip.baidubce.com/rest/2.0/ocr/v1"
  # 腾讯OCR配置
  tencent:
    secret_id_env: "TENCENT_OCR_SECRET_ID"
    secret_key_env: "TENCENT_OCR_SECRET_KEY"
    region: "ap-beijing"
  # 阿里云OCR配置
  alibaba:
    access_key_id_env: "ALIBABA_OCR_ACCESS_KEY_ID"
    access_key_secret_env: "ALIBABA_OCR_ACCESS_KEY_SECRET"
    endpoint: "ocr-api.cn-hangzhou.aliyuncs.com"
  # Tesseract本地OCR（免费）
  tesseract:
    language: "chi_sim+eng"  # 中文+英文
    custom_config: ""
  # OCR超时和重试
  timeout: 30
  max_retries: 3
  # 支持的图像格式
  supported_formats:
    - "image/png"
    - "image/jpeg"
    - "image/jpg"
    - "image/bmp"
    - "image/tiff"
    - "application/pdf"