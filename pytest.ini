[pytest]
# 三个测试文件都是「顶层函数 + __main__ 里跑一遍」的双用途写法：
# 既可以直接 python test_xxx.py，也可以被 pytest 收集。
# test_marl.py 的执行入口叫 run_all_tests()，所以这里不开 python_functions 覆盖。
testpaths = .
python_files = test_*.py
python_classes = Test*
# 排除不需要扫描的目录，防止本地全量 pytest 卡死
# .runtime 里有语料库自带的 test_*.py 夹具（同名两份 → import mismatch），必须排除
norecursedirs = AgentRL_BranchTest .git __pycache__ *.egg build dist .runtime .hypothesis .pytest_cache .backup
addopts = -q